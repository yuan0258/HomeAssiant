# Apple HomeKit Bridges
homekit:
  - name: "Pi4 Smart Home"
    port: 21063
    mode: bridge
    filter:
      include_entities:
        - light.yeelink_bslamp2_2a87_light
        - vacuum.rockrobo_v1_6536_robot_cleaner
        - sensor.miaomiaoce_o2_f576_temperature
        - sensor.miaomiaoce_o2_f576_relative_humidity
        - media_player.monitor_samsung_m7_32

  - name: "C400 Camera"
    port: 21064
    mode: accessory
    filter:
      include_entities:
        - camera.chuangmi_039c04_c643_camera_control
    entity_config:
      camera.chuangmi_039c04_c643_camera_control:
        stream_source: "-rtsp_transport tcp -i rtsp://127.0.0.1:8554/c400 -preset superfast"
        stream_count: 2
        video_codec: libx264
        video_profile_names:
          - "baseline"
          - "main"
          - "high"
        support_audio: true
        max_fps: 20
        max_width: 864
        max_height: 480
